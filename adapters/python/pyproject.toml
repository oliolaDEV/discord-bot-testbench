[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-bot-testbench"
version = "0.2.0"
description = "Development interaction adapter for Discord Bot Testbench and discord.py"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["discord.py>=2.6,<2.8", "aiohttp>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["discord_testbench*"]
