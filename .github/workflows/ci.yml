name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./adapters/python
      - name: Configure Python adapter test
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('TESTBENCH_PYTHON=' + sys.executable + '\n')
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm pack --dry-run

  http-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - run: go test ./...
        working-directory: adapters/http/go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -d .testbench/java-build adapters/http/java/TestbenchHandler.java
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build adapters/http/dotnet/Testbench.Http.csproj --configuration Release
