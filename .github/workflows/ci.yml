name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }}, discord.py ${{ matrix.discord-py.version }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
        discord-py:
          - version: '2.6'
            package: 'discord.py==2.6.*'
          - version: '2.7'
            package: 'discord.py==2.7.*'
          - version: '2.8.0a'
            package: 'discord.py @ git+https://github.com/Rapptz/discord.py@1add8a0b40577186431cdb5f63f97affadab285b'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install ./adapters/python "${{ matrix.discord-py.package }}"
      - name: Configure Python adapter test
        shell: python
        run: |
          import os, sys
          with open(os.environ['GITHUB_ENV'], 'a') as file:
              file.write('TESTBENCH_PYTHON=' + sys.executable + '\n')
      - run: npm run check
      - run: npm test
      - run: npm run test:package
      - run: npm pack --dry-run

  http-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.23'
          cache: false
      - run: go test ./...
        working-directory: adapters/http/go
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -d .testbench/java-build adapters/http/java/TestbenchHandler.java
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build adapters/http/dotnet/Testbench.Http.csproj --configuration Release
